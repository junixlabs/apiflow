name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - run: npm run boundary
      - run: npm run codemap
      - run: npm run map:check
      - run: npm run verify:pack
      # cm:guard Publish from packages/cli, NEVER from the repo root: at the root `npm publish` packs
      # 170 files including .forge/ and CLAUDE.md into a public tarball, and only `private` refuses it.
      # cm:why A directory publish, not the tarball verify:pack built: 1.1.13 got its OIDC provenance
      # attestation this way, and npm does not attest a tarball spec. prepack rebuilds the same bundle.
      - run: npm publish --access public
        working-directory: packages/cli
