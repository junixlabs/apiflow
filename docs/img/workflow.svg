<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 584" width="1160" height="584" role="img" aria-labelledby="wf-title wf-desc">
<title id="wf-title">How apiflow builds and reads a dependency map</title>
<desc id="wf-desc">Three extractors run where the code is and produce one deterministic .apimap file, which is read three ways — a CLI, a local browser UI, and an MCP server for agents. The request runner that used to sit beside it is now a separate repo, junixlabs/apiflow-runner.</desc>
